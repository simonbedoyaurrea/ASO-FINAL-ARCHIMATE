<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="226.33mm" viewBox="0 0 1800 970"><defs>
<marker id="r" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1 1L10 5L1 9Z" fill="white" stroke="#202020" stroke-width="1.2"/></marker>
<marker id="s" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M1 1L9 4L1 7" fill="none" stroke="#202020" stroke-width="1.5"/></marker>
<marker id="f" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#202020"/></marker>
</defs><rect width="1800" height="970" fill="#707070"/><rect x="44" y="14" width="1704" height="43.2" fill="white"/><text x="48" y="42" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#283239" text-anchor="start">V11 · Canvas — Tarifas y transbordos</text><rect x="44" y="53" width="1704" height="25.2" fill="white"/><text x="48" y="71" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#525d64" text-anchor="start">Tema 4 · Un contexto principal en una página</text><line x1="48" y1="92" x2="1752" y2="92" stroke="#c9cdd0"/><rect x="48" y="120" width="1704" height="90" rx="9" fill="#f7dfaa" stroke="#a2a9ac" stroke-width="1.3"/><text x="66" y="144.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#283239" text-anchor="start">Propósito · clasificación · rol</text><line x1="66" y1="168.25" x2="1734" y2="168.25" stroke="#a2a9ac" stroke-opacity=".5"/><text x="66" y="182.25" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#283239" text-anchor="start">Calcular tarifa e integración por validación. Contexto central: versiona reglas y calcula importes. Perfiles, saldos y cobros pertenecen a otros contextos.</text><rect x="44" y="227" width="1704" height="25.2" fill="white"/><text x="48" y="245" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#283239" text-anchor="start">Entradas</text><rect x="628" y="227" width="1120" height="25.2" fill="white"/><text x="632" y="245" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#283239" text-anchor="start">Dentro de Tarifas y transbordos</text><rect x="1212" y="227" width="536" height="25.2" fill="white"/><text x="1216" y="245" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#283239" text-anchor="start">Salidas</text><rect x="48" y="270" width="520" height="98" rx="9" fill="#edf0f2" stroke="#a2a9ac" stroke-width="1.3"/><text x="66" y="294.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#283239" text-anchor="start">Ente gestor</text><line x1="66" y1="316.9" x2="550" y2="316.9" stroke="#a2a9ac" stroke-opacity=".5"/><text x="66" y="330.9" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">C · Registrar acto y vigencia. La autoridad define; el gestor</text><text x="66" y="349.35999999999996" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">registra.</text><rect x="632" y="270" width="520" height="98" rx="9" fill="#f7dfaa" stroke="#a2a9ac" stroke-width="1.3"/><text x="650" y="294.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#283239" text-anchor="start">Versionar reglas</text><line x1="650" y1="316.9" x2="1134" y2="316.9" stroke="#a2a9ac" stroke-opacity=".5"/><text x="650" y="330.9" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Conservar tarifas y reglas de integración versionadas.</text><rect x="1216" y="270" width="536" height="98" rx="9" fill="#dceef3" stroke="#a2a9ac" stroke-width="1.3"/><text x="1234" y="294.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#283239" text-anchor="start">Equipos externos</text><line x1="1234" y1="316.9" x2="1734" y2="316.9" stroke="#a2a9ac" stroke-opacity=".5"/><text x="1234" y="330.9" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">E · Versión vigente a equipos mediante ACL; no administrar</text><text x="1234" y="349.35999999999996" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">hardware.</text><path d="M568,319 L632,319" fill="none" stroke="#202020" stroke-width="2"  marker-end="url(#f)"/><path d="M1152,319 L1216,319" fill="none" stroke="#202020" stroke-width="2"  marker-end="url(#f)"/><rect x="48" y="380" width="520" height="98" rx="9" fill="#edf0f2" stroke="#a2a9ac" stroke-width="1.3"/><text x="66" y="404.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#283239" text-anchor="start">Recepción</text><line x1="66" y1="426.9" x2="550" y2="426.9" stroke="#a2a9ac" stroke-opacity=".5"/><text x="66" y="440.9" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">E · Validación: ID, instante, modo, medio y viaje. C/P.</text><rect x="632" y="380" width="520" height="98" rx="9" fill="#f7dfaa" stroke="#a2a9ac" stroke-width="1.3"/><text x="650" y="404.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#283239" text-anchor="start">Calcular tarifa</text><line x1="650" y1="426.9" x2="1134" y2="426.9" stroke="#a2a9ac" stroke-opacity=".5"/><text x="650" y="440.9" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">C · Calcular importe con regla, perfil e integración</text><text x="650" y="459.35999999999996" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">vigentes.</text><rect x="1216" y="380" width="536" height="98" rx="9" fill="#dceef3" stroke="#a2a9ac" stroke-width="1.3"/><text x="1234" y="404.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#283239" text-anchor="start">VAMOS / Banco / Consolidación</text><line x1="1234" y1="426.9" x2="1734" y2="426.9" stroke="#a2a9ac" stroke-opacity=".5"/><text x="1234" y="440.9" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">E · Tarifa a VAMOS/banco y Consolidación. No concilia. C/P.</text><path d="M568,429 L632,429" fill="none" stroke="#202020" stroke-width="2"  marker-end="url(#f)"/><path d="M1152,429 L1216,429" fill="none" stroke="#202020" stroke-width="2"  marker-end="url(#f)"/><rect x="48" y="505" width="1704" height="90" rx="9" fill="#dceef3" stroke="#a2a9ac" stroke-width="1.3"/><text x="66" y="529.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Consultas y contrato</text><line x1="66" y1="550.55" x2="1734" y2="550.55" stroke="#a2a9ac" stroke-opacity=".5"/><text x="66" y="564.55" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#283239" text-anchor="start">Consulta tarifa/regla: responde al solicitante, sin cobrar. Consulta Perfiles (C/P) y Planeación (C/P + ACL). Entrada: validación y contexto. Salida: importe, regla, versión y estado. Recalcular no vuelve a cobrar.</text><rect x="48" y="620" width="552" height="170" rx="9" fill="#fff0c7" stroke="#a2a9ac" stroke-width="1.3"/><text x="66" y="644.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#283239" text-anchor="start">Lenguaje ubicuo</text><line x1="66" y1="666.9" x2="582" y2="666.9" stroke="#a2a9ac" stroke-opacity=".5"/><text x="66" y="680.9" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Validación: acceso registrado.</text><text x="66" y="699.36" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Transbordo: continuación integrada por una regla.</text><text x="66" y="717.8199999999999" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Perfil vigente: elegibilidad en el instante del viaje.</text><text x="66" y="736.28" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Tarifa: importe central, no tarifa técnica del operador.</text><rect x="624" y="620" width="552" height="170" rx="9" fill="#f7dfaa" stroke="#a2a9ac" stroke-width="1.3"/><text x="642" y="644.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#283239" text-anchor="start">Decisiones de negocio</text><line x1="642" y1="666.9" x2="1158" y2="666.9" stroke="#a2a9ac" stroke-opacity=".5"/><text x="642" y="680.9" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Autoridad define; gestor registra.</text><text x="642" y="699.36" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Perfiles valida; Tarifas calcula.</text><text x="642" y="717.8199999999999" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">VAMOS mueve saldo; banco cobra.</text><text x="642" y="736.28" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Consolidación agrupa, no concilia.</text><text x="642" y="754.74" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Corregir con rastro, sin editar cobros históricos.</text><rect x="1200" y="620" width="552" height="170" rx="9" fill="#edf0f2" stroke="#a2a9ac" stroke-width="1.3"/><text x="1218" y="644.0" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#283239" text-anchor="start">Supuestos y configuración</text><line x1="1218" y1="666.9" x2="1734" y2="666.9" stroke="#a2a9ac" stroke-opacity=".5"/><text x="1218" y="680.9" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">ID estable y vigencia histórica disponibles. Importes y ventanas</text><text x="1218" y="699.36" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">vienen de reglas autorizadas. Sin datos suficientes: «no</text><text x="1218" y="717.8199999999999" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">tarifable», con causa.</text><rect x="48" y="815" width="840" height="90" rx="9" fill="#dceef3" stroke="#a2a9ac" stroke-width="1.3"/><text x="66" y="839.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Verificación</text><line x1="66" y1="860.55" x2="870" y2="860.55" stroke="#a2a9ac" stroke-opacity=".5"/><text x="66" y="874.55" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#283239" text-anchor="start">Exactitud por modo, medio, perfil y transbordo; causas de no tarifables; diferencias con equipos; tiempo de</text><text x="66" y="891.5899999999999" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#283239" text-anchor="start">cálculo.</text><rect x="912" y="815" width="840" height="90" rx="9" fill="#edf0f2" stroke="#a2a9ac" stroke-width="1.3"/><text x="930" y="839.0" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#283239" text-anchor="start">Límites</text><line x1="930" y1="860.55" x2="1734" y2="860.55" stroke="#a2a9ac" stroke-opacity=".5"/><text x="930" y="874.55" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#283239" text-anchor="start">Fuera: dispositivos, certificación externa, saldos, cobro bancario, conciliación y pago a operadores.</text><rect x="44" y="915" width="1704" height="19.8" fill="white"/><text x="48" y="930" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#283239" text-anchor="start">C: comando · Q: consulta · E: evento. Las flechas son colaboraciones lógicas; no requieren un bus de mensajes.</text><rect x="44" y="937" width="1704" height="18.0" fill="white"/><text x="48" y="951" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#283239" text-anchor="start">Adaptación de DDD Crew · Bounded Context Canvas v5 · CC BY 4.0 · Detalle: Analisis-V10-V11.md</text></svg>