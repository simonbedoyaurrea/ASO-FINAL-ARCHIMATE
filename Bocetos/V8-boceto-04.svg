<rect x="928" y="1010" width="824" height="90" rx="8" class="ext"/><text x="948" y="1040" class="name">Contabilidad, conciliación y operadores</text><text x="948" y="1066" class="body">Reciben la base de Consolidación [PL]; conciliar, liquidar y pagar queda fuera.</text>
<rect x="48" y="1130" width="1704" height="100" rx="7" fill="#f5f1e7" stroke="#b9a77a"/><text x="68" y="1159" class="name">Leyenda y alcance</text><text x="68" y="1186" class="small">Dorado: contexto interno · Gris punteado: externo · Flecha continua: flujo interno · Flecha discontinua: intercambio externo.</text><text x="68" y="1209" class="small">C/P: cliente-proveedor · CF: conformista · ACL: capa anticorrupción · OHS/PL: servicio abierto / lenguaje publicado. Boceto, no vista canónica de Archi.</text>
