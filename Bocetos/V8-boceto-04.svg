<rect width="1800" height="1273" fill="white"/>
<text x="48" y="52" class="title">V8 · Mapa de contextos — recaudo integrado</text><text x="48" y="80" class="body">Tema 4 · Buses alimentadores, buses articulados y metro</text><line x1="48" y1="102" x2="1752" y2="102" stroke="#ccc"/>
