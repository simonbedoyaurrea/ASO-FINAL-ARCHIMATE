<path d="M388 790H438V560H488" class="flow"/><rect x="397" y="695" width="160" height="31" rx="4" class="tag"/><text x="477" y="716" text-anchor="middle" class="small">C/P · perfil vigente</text>
<rect x="928" y="744" width="340" height="194" rx="11" class="card"/><text x="1098" y="776" text-anchor="middle" class="name">Tarjetas VAMOS y saldos</text><line x1="948" y1="791" x2="1248" y2="791" class="divider"/><text x="948" y="818" class="body">Emite, personaliza, recarga,</text><text x="948" y="841" class="body">consulta saldo y bloquea tarjetas.</text><text x="948" y="885" class="small">Servicio: gestionar tarjetas y saldos.</text><text x="948" y="908" class="small">Interfaz: operaciones VAMOS.</text>
