<text x="48" y="386" class="section">Aplicación</text>
<rect x="48" y="410" width="340" height="194" rx="11" class="card"/><text x="218" y="442" text-anchor="middle" class="name">Recepción de transacciones</text><line x1="68" y1="457" x2="368" y2="457" class="divider"/><text x="68" y="484" class="body">Recibe y normaliza los registros</text><text x="68" y="507" class="body">de acceso de los tres modos.</text><text x="68" y="551" class="small">Servicio: recibir transacciones.</text><text x="68" y="574" class="small">Interfaz: ingreso de validaciones.</text>
<rect x="488" y="410" width="340" height="194" rx="11" class="card"/><text x="658" y="442" text-anchor="middle" class="name">Tarifas y transbordos</text><line x1="508" y1="457" x2="808" y2="457" class="divider"/><text x="508" y="484" class="body">Calcula la tarifa plena o especial</text><text x="508" y="507" class="body">y la integración entre modos.</text><text x="508" y="551" class="small">Servicio: calcular tarifa del viaje.</text><text x="508" y="574" class="small">Interfaz: consulta de tarifas.</text>
<rect x="928" y="410" width="340" height="194" rx="11" class="card"/><text x="1098" y="442" text-anchor="middle" class="name">Pago con tarjeta bancaria</text><line x1="948" y1="457" x2="1248" y2="457" class="divider"/><text x="948" y="484" class="body">Procesa débito/crédito y registra</text><text x="948" y="507" class="body">la respuesta del adquirente.</text><text x="948" y="551" class="small">Servicio: cobrar viajes.</text><text x="948" y="574" class="small">Interfaz: pago bancario.</text>
<rect x="1368" y="410" width="384" height="194" rx="11" class="card"/><text x="1560" y="442" text-anchor="middle" class="name">Consolidación del recaudo</text><line x1="1388" y1="457" x2="1732" y2="457" class="divider"/><text x="1388" y="484" class="body">Agrupa por modo, ruta y operador.</text><text x="1388" y="507" class="body">Distingue consumo, recarga y cobro.</text><text x="1388" y="551" class="small">Servicio: consolidar y entregar base.</text><text x="1388" y="574" class="small">Interfaz: consulta / exportación de base.</text>
